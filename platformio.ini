; SatPointer - elevation/azimuth readout on a bare ESP-12F.
;
;   pio run -t upload            flash over serial (needs GPIO0 held low)
;   pio run -e ota -t upload     flash over WiFi, no cable and no button
;   python3 tools/monitor.py     serial capture

[platformio]
default_envs = satpointer

[env]
platform = espressif8266
board = esp12e
framework = arduino

monitor_speed = 115200

; 64 for a 0.96" panel, 32 for a 0.91".
build_flags = -D OLED_H=64
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:satpointer]
upload_speed = 115200
upload_port = /dev/cu.usbserial-0001

; OTA needs room for a second copy of the image in the 1MB app partition, so
; the sketch has to stay under about half of it. It is ~370KB today.
[env:ota]
upload_protocol = espota
upload_port = satpointer.local
