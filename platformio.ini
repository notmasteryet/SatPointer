; SatPointer - elevation/azimuth readout on a bare ESP-12F.
;
;   pio run -t upload                  the application (default env)
;   pio run -e i2cprobe -t upload      scan the bus, identify each chip
;   pio run -e oled -t upload          SSD1306 only
;   pio run -e blink -t upload         LED + chip info only

[platformio]
default_envs = satpointer

[env]
platform = espressif8266
board = esp12e
framework = arduino

monitor_speed = 115200
upload_speed = 115200
upload_port = /dev/cu.usbserial-0001

; 64 for a 0.96" panel, 32 for a 0.91".
build_flags = -D OLED_H=64
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

[env:satpointer]
build_src_filter = +<satpointer.cpp>

[env:i2cprobe]
build_src_filter = +<tests/i2c_probe.cpp>

[env:oled]
build_src_filter = +<tests/oled.cpp>

[env:blink]
build_src_filter = +<tests/blink.cpp>
